spring.application.name=ledger

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ledger
ledger.security.jwt-secret=change-me
ledger.security.access-token-ttl=15m
ledger.security.refresh-token-ttl=7d
ledger.security.refresh-token-store=redis
ledger.transfer.fee-percent=0
ledger.transfer.min-amount=0.01
ledger.transfer.max-amount=1000000
ledger.outbox.poll-interval-ms=1000
ledger.outbox.batch-size=50
ledger.outbox.max-attempts=5
ledger.gateway.base-url=http://localhost:8081
ledger.gateway.connect-timeout-ms=2000
ledger.gateway.read-timeout-ms=5000
ledger.gateway.settle-async=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ledger.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.ledger.messaging.OutboxMessage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
